name: Build & publish F-Droid repo

# Runs on version tags (v1.2, v1.3, …) or manually. Builds a signed release APK,
# regenerates the F-Droid repo index (keeping previously published versions),
# publishes everything to the gh-pages branch, and attaches the APK to a Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # push to gh-pages + create the GitHub Release

concurrency:
  group: fdroid-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools & fdroidserver
        run: |
          sdkmanager "build-tools;36.0.0" "platforms;android-36"
          pipx install fdroidserver
          fdroid --version

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set. See docs/FDROID.md."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/keystore.p12
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Restore previously published repo
        run: |
          mkdir -p site/fdroid/repo
          # Pull the existing gh-pages content (if any) so old APK versions survive.
          if git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            git archive origin/gh-pages | tar -x -C site
            echo "Restored existing gh-pages content."
          else
            echo "No existing gh-pages branch — starting fresh."
          fi

      - name: Assemble F-Droid repo inputs
        run: |
          mkdir -p site/fdroid/metadata/com.theob.gymlogger
          cp fdroid/config.yml site/fdroid/config.yml
          cp fdroid/metadata/com.theob.gymlogger.yml site/fdroid/metadata/
          # Localized store text / screenshots / icon from fastlane.
          cp -r fastlane/metadata/android/* site/fdroid/metadata/com.theob.gymlogger/
          # Repo signing key (same key as the APK); removed again before publishing.
          cp "$RUNNER_TEMP/keystore.p12" site/fdroid/keystore.p12
          # Repo icon SOURCE: fdroid reads it from the base dir and copies it into
          # repo/icons/ itself (config.yml sets repo_icon: icon.png).
          cp logo.png site/fdroid/icon.png
          # The freshly built APK, named by tag/sha.
          cp app/build/outputs/apk/release/app-release.apk \
             "site/fdroid/repo/gymlogger-${GITHUB_REF_NAME:-$GITHUB_SHA}.apk"

      - name: Generate & sign F-Droid index
        working-directory: site/fdroid
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: fdroid update --verbose --create-metadata

      - name: Build landing page & scrub secrets
        run: |
          rm -f site/fdroid/keystore.p12          # never publish the signing key
          touch site/.nojekyll                    # serve dot/underscore files verbatim
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>GymLogger F-Droid repo</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem}code{background:#eee;padding:.1em .3em;border-radius:4px}</style>
          <h1>GymLogger F-Droid repository</h1>
          <p>Add this URL as a repository in the F-Droid (or Neo Store / Droid-ify) client:</p>
          <p><code>https://theoborealis.github.io/GymLogger/fdroid/repo</code></p>
          <p>Then install <b>GymLogger</b> and get automatic updates.</p>
          <p>Prefer no repo? Point <a href="https://github.com/ImranR98/Obtainium">Obtainium</a> at the
          <a href="https://github.com/theoborealis/GymLogger/releases">releases page</a>.</p>
          HTML

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Publish ${GITHUB_REF_NAME:-$GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
